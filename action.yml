name: Astralform Agent
description: >-
  Hand an issue or pull request to your Astralform agent. No secrets to
  configure — the workflow proves which repository it is with a GitHub-signed
  OIDC token.
author: Astralform

branding:
  icon: cpu
  color: orange

inputs:
  agent:
    description: >-
      Which agent answers. This is the agent's NAME as it appears in the
      Astralform dashboard — dispatch resolves by name, scoped to the GitHub
      account that owns this repository, so a name only resolves inside the
      account it belongs to.
    required: true

  mode:
    description: >-
      What kind of run to start. `mention` answers what asked for it; `review`
      starts a review run on a pull request, which the repository must have
      opted into in the Astralform dashboard.
    required: false
    default: 'mention'

  instruction:
    description: >-
      What to ask the agent. Defaults to the body of whatever triggered the
      run — the comment, the issue, or the pull request. Set this only to
      override that.
    required: false
    default: ''

  issue-number:
    description: >-
      The issue or pull request the run is about. Defaults to whichever the
      triggering event carries.
    required: false
    default: ''

  api-url:
    description: >-
      Astralform API base URL. Only set this for a self-hosted deployment; the
      OIDC audience must match it.
    required: false
    default: https://api.astralform.ai

  audience:
    description: >-
      The audience to mint the OIDC token for. Must be the value the receiving
      deployment pins, or it refuses the token. Change it only alongside
      api-url.
    required: false
    default: https://api.astralform.ai

outputs:
  status:
    description: Dispatch result reported by Astralform.
    value: ${{ steps.dispatch.outputs.status }}
  agent:
    description: The agent that picked the run up.
    value: ${{ steps.dispatch.outputs.agent }}
  repository:
    description: The repository Astralform resolved from the OIDC token.
    value: ${{ steps.dispatch.outputs.repository }}
  issue-number:
    description: The issue or pull request the run is about.
    value: ${{ steps.dispatch.outputs.issue-number }}

runs:
  using: composite
  steps:
    - id: dispatch
      uses: actions/github-script@v7
      env:
        # Every one of these is passed through the environment rather than
        # interpolated into the script body. `instruction` is attacker-controlled
        # text — anyone who can open an issue writes it — and a `${{ }}` splice
        # of it into JavaScript is a script injection on the runner. Reading it
        # from process.env is the only form that cannot be escaped out of.
        ASTRALFORM_AGENT: ${{ inputs.agent }}
        ASTRALFORM_MODE: ${{ inputs.mode }}
        ASTRALFORM_INSTRUCTION: ${{ inputs.instruction }}
        ASTRALFORM_ISSUE_NUMBER: ${{ inputs.issue-number }}
        ASTRALFORM_API_URL: ${{ inputs.api-url }}
        ASTRALFORM_AUDIENCE: ${{ inputs.audience }}
      with:
        script: |
          const {
            ASTRALFORM_AGENT: agent,
            ASTRALFORM_API_URL: apiUrl,
            ASTRALFORM_AUDIENCE: audience,
          } = process.env;

          // The manifest defaults this to mention, so a caller that never sets
          // it dispatches exactly what it did before. An explicit empty string
          // still arrives empty, which is why the fallback is repeated here.
          const mode = process.env.ASTRALFORM_MODE || 'mention';

          const payload = context.payload;

          // The comment first, then the issue, then the pull request — the same
          // order the event types are registered in. A comment event also
          // carries the issue it is on, so checking the issue first would
          // answer the wrong text on every reply.
          const fromEvent = (...paths) => {
            for (const pick of paths) {
              const value = pick();
              if (value !== undefined && value !== null && value !== '') return value;
            }
            return undefined;
          };

          const instruction =
            process.env.ASTRALFORM_INSTRUCTION ||
            fromEvent(
              () => payload.comment?.body,
              () => payload.issue?.body,
              () => payload.pull_request?.body,
            ) ||
            '';

          const issueNumber = Number(
            process.env.ASTRALFORM_ISSUE_NUMBER ||
              fromEvent(
                () => payload.issue?.number,
                () => payload.pull_request?.number,
              ) ||
              0,
          );

          // Who asked. The OIDC token proves which REPOSITORY is calling and
          // says nothing about the person, so Astralform gates on this — only
          // an OWNER, MEMBER or COLLABORATOR may start a run. It is reported,
          // never asserted: the server re-checks it against the repository.
          const authorAssociation =
            fromEvent(
              () => payload.comment?.author_association,
              () => payload.issue?.author_association,
              () => payload.pull_request?.author_association,
            ) || '';

          if (!agent) {
            core.setFailed('The `agent` input is required.');
            return;
          }

          // Refused here rather than forwarded for the server to interpret: a
          // typo in a workflow should name the accepted values on the runner,
          // not come back as an opaque refusal of an otherwise valid dispatch.
          const modes = ['mention', 'review'];
          if (!modes.includes(mode)) {
            core.setFailed(
              `The \`mode\` input must be one of ${modes.join(' or ')}. Got \`${mode}\`.`,
            );
            return;
          }

          // Needs `permissions: id-token: write` on the calling job. Without it
          // this throws, and the message below is the one thing that makes that
          // diagnosable — the raw error names an unset environment variable.
          let token;
          try {
            token = await core.getIDToken(audience);
          } catch (error) {
            core.setFailed(
              'Could not mint an OIDC token. Add `permissions: { id-token: write }` ' +
                `to this job. (${error.message})`,
            );
            return;
          }

          const endpoint = `${apiUrl.replace(/\/+$/, '')}/v1/github/dispatch`;
          core.info(`Dispatching to ${agent} (${context.repo.owner}/${context.repo.repo}#${issueNumber})`);

          // ONE DISPATCH, RETRIED. A burst is a supported way to use this action —
          // 20 pull requests opened at once dispatch 20 reviews — and the server
          // throttles per repository with a 429 and a `Retry-After`. Without a
          // retry here, that throttle is a red CI run in seconds: the exact
          // "astralform (pull_request) Failing after 5s" a fan-out produced, where
          // nothing was wrong except that the platform was busy.
          //
          // Only statuses that mean "try again" are retried. A 401/403/404/422 is a
          // configuration answer and is reported immediately — retrying it would
          // just delay the explanation.
          const RETRYABLE_STATUSES = new Set([429, 502, 503, 504]);
          const MAX_ATTEMPTS = 4;
          const MAX_WAIT_MS = 30000;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          // `Retry-After` is the server telling us WHEN, which beats any backoff we
          // could invent. It is documented as seconds or an HTTP date; only the
          // seconds form is used, and an unreadable header falls back to jittered
          // exponential backoff. Capped: a workflow must not sit for an hour.
          const waitBeforeRetry = (response, attempt) => {
            const headerSeconds = Number(response.headers.get('retry-after'));
            if (Number.isFinite(headerSeconds) && headerSeconds > 0) {
              return Math.min(headerSeconds * 1000, MAX_WAIT_MS);
            }
            const base = Math.min(500 * 2 ** (attempt - 1), 8000);
            // Jittered, so a fleet of workflows throttled by ONE burst does not
            // retry in lockstep and re-create the burst.
            return Math.min(base * (0.5 + Math.random() * 0.5), MAX_WAIT_MS);
          };

          // Not `payload` — that name is already the event payload above.
          const requestBody = JSON.stringify({
            agent,
            issue_number: issueNumber || null,
            instruction,
            author_association: authorAssociation,
            mode,
          });

          let response;
          for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1) {
            try {
              response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                },
                body: requestBody,
              });
            } catch (error) {
              // A network failure is retryable for the same reason a 5xx is, and
              // is the one failure with no status to report.
              if (attempt === MAX_ATTEMPTS) {
                core.setFailed(
                  `Could not reach Astralform at ${endpoint} after ${MAX_ATTEMPTS} attempts: ` +
                    `${error.message}`,
                );
                return;
              }
              core.warning(
                `Attempt ${attempt}/${MAX_ATTEMPTS} could not reach Astralform ` +
                  `(${error.message}); retrying.`,
              );
              await sleep(Math.min(500 * 2 ** (attempt - 1), 8000));
              continue;
            }

            if (!RETRYABLE_STATUSES.has(response.status) || attempt === MAX_ATTEMPTS) {
              break;
            }
            const waitMs = waitBeforeRetry(response, attempt);
            core.warning(
              `Astralform answered ${response.status} (attempt ${attempt}/${MAX_ATTEMPTS}); ` +
                `retrying in ${Math.round(waitMs / 1000)}s.`,
            );
            await sleep(waitMs);
          }

          const raw = await response.text();
          let body;
          try {
            body = JSON.parse(raw);
          } catch {
            body = null;
          }

          if (!response.ok) {
            // FastAPI puts the reason in `detail`. Surfacing it is the whole
            // difference between "the agent did not answer" and "that agent
            // name does not resolve in this account".
            const detail = body?.detail ?? raw ?? '';
            // A retryable status that survived every attempt is a different
            // sentence from one that was refused outright: the first is "still
            // busy", the second is "this will not work".
            const tried = RETRYABLE_STATUSES.has(response.status)
              ? ` after ${MAX_ATTEMPTS} attempts`
              : '';
            core.setFailed(
              `Astralform refused the dispatch (${response.status}${tried}): ${detail}`,
            );
            return;
          }

          core.setOutput('status', body?.status ?? 'ok');
          core.setOutput('agent', body?.agent ?? agent);
          core.setOutput('repository', body?.repository ?? `${context.repo.owner}/${context.repo.repo}`);
          core.setOutput('issue-number', body?.issue_number ?? issueNumber);
          core.info(`Astralform accepted the run: ${body?.status ?? 'ok'}`);
